<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipbook — Kashvi Ruparelia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#1d1f24;
    --void-soft:#26282e;
    --paper:#f1f0eb;
    --mute:#9298a4;
    --hairline:#3c3f48;
    --cyan:#6fc3ff;
    --buy:#1f7bff;
    --buy-hover:#4a95ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--void);
    color:var(--paper);
    font-family:'Instrument Serif',serif;
    font-style:italic;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:28px 48px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    border-bottom:1px solid var(--hairline);
  }
  header a{
    color:var(--mute);
    text-decoration:none;
    font-size:0.95rem;
    transition:color .2s;
  }
  header a:hover{color:var(--cyan);}
  header .back{justify-self:start;}
  header .title{font-size:1.1rem;justify-self:end;}
  header a.buy-btn{
    justify-self:center;
    display:inline-block;
    background:var(--buy);
    color:#fff;
    font-size:1.35rem;
    padding:14px 38px;
    border-radius:999px;
    box-shadow:0 6px 20px rgba(31,123,255,.35);
    transition:background .2s, transform .2s, box-shadow .2s;
  }
  header a.buy-btn:hover{
    background:var(--buy-hover);
    color:#fff;
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(31,123,255,.5);
  }
  main{
    flex:1;
    padding:40px 48px 60px;
    max-width:1000px;
    margin:0 auto;
    width:100%;
  }
  main .cap{
    color:var(--mute);
    font-size:0.95rem;
    margin-bottom:8px;
  }
  .visits{
    color:var(--mute);
    font-size:2rem;
    margin-bottom:20px;
    font-weight:normal;
    text-align:center;
  }
  #visit-count{
    color:var(--cyan);
    font-size:2.2rem;
    font-weight:bold;
    font-style:normal;
  }
  .fp-iframe{
    border:0;
    width:100%;
    height:600px;
    display:block;
  }
  @media(max-width:640px){
    header{
      padding:20px 22px;
      grid-template-columns:1fr auto;
      row-gap:16px;
    }
    header .buy-btn{
      grid-column:1 / -1;
      grid-row:2;
      font-size:1.2rem;
      padding:12px 32px;
    }
    main{padding-left:22px;padding-right:22px;}
  }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">&larr; Back to portfolio</a>
  <a class="buy-btn" href="https://amzn.in/d/04XE4fjD" target="_blank" rel="noopener">Buy Paperback</a>
  <span class="title">Flipbook</span>
</header>
<main>
  
  <h1 class="visits">Total Book Reads: <span id="visit-count">—</span></h1>
  <div class="fp-wrap">
    <iframe allowfullscreen="allowfullscreen" allow="autoplay; fullscreen; clipboard-write" scrolling="no" class="fp-iframe" src="https://heyzine.com/flip-book/ae6923ff2a.html" style="border: 0px; width: 100%; height: 600px;" spellcheck="false"></iframe>
  </div>
</main>

<script>
  (function () {
    var el = document.getElementById('visit-count');
    var namespace = 'kashvi-ruparelia-portfolio';
    var key = 'impact-flipbook';
    var alreadyCounted = sessionStorage.getItem('counted-' + key);
    var endpoint = alreadyCounted
      ? 'https://abacus.jasoncameron.dev/get/' + namespace + '/' + key
      : 'https://abacus.jasoncameron.dev/hit/' + namespace + '/' + key;

    fetch(endpoint)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        el.textContent = data.value.toLocaleString();
        sessionStorage.setItem('counted-' + key, '1');
      })
      .catch(function () {
        el.textContent = 'N/A';
      });
  })();
</script>
</body>
</html>
